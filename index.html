<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d1f">
  <title>MeteGol AR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  <link rel="stylesheet" href="css/style.css">

  <!-- MindAR 1.2.5 importa sRGBEncoding de three, que se eliminó en la r162:
       three debe quedarse en 0.160.x (la versión que usa la documentación de MindAR). -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <!-- MindAR inserta aquí el video de la cámara y el canvas de three.js -->
  <div id="ar-container"></div>

  <div id="ui">
    <section id="screen-start" class="screen">
      <h1>MeteGol AR</h1>
      <p>Escanea el marcador para ver la cancha.</p>
      <button id="btn-start" class="btn" type="button">Jugar</button>
      <p id="start-error" class="error" hidden></p>
    </section>

    <div id="hud" hidden>
      <div class="hud-top">
        <span class="hud-item">⚽ <b id="hud-goals">0</b></span>
        <span id="hud-lives" class="hud-item" aria-label="Vidas"></span>
        <span class="hud-item">⏱ <b id="hud-time">60</b></span>
      </div>
      <div id="message" class="message" hidden></div>
      <button id="btn-kick" class="btn-kick" type="button">PATEAR</button>
    </div>

    <div id="scanning" class="hint" hidden>
      <span class="hint-icon" aria-hidden="true">📷</span>
      Apunta tu cámara al marcador
    </div>

    <section id="screen-end" class="screen screen-overlay" hidden>
      <h1 id="end-title"></h1>
      <p id="end-summary"></p>
      <button id="btn-restart" class="btn" type="button">Jugar otra vez</button>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
